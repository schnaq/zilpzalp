# ZilpZalp — zentraler Einstieg für alle Werkzeuge.
#
# Alles läuft über `mise run …`. Nicht direkt xcodebuild, swift oder brew
# aufrufen, sonst weicht die Entwicklungsmaschine vom CI-Runner ab.

[tools]
# Exakt gepinnt: Entwicklungsmaschine und self-hosted Runner sollen dieselben
# Binaries benutzen. Kein Homebrew — sonst driften die Versionen auseinander.
python      = "3.13.14" # für die Werkzeuge in tools/
swiftformat = "0.62.1"
swiftlint   = "0.65.0"
xcbeautify  = "3.2.1"
xcodegen    = "2.46.0" # erzeugt apps/ZilpZalp/ZilpZalp.xcodeproj aus project.yml

# Xcode ist nicht über mise installierbar und liefert zugleich den
# Swift-Compiler, mit dem xcodebuild übersetzt. Deshalb wird Xcode nicht
# installiert, sondern geprüft — siehe Task `xcode-version`.
#
# Zur Sprachversion: Der Spec nennt „Swift 6.2". Xcode 26.6 liefert
# swiftc 6.3.3. „Swift 6.2" ist deshalb als Sprach- und Tools-Version zu
# lesen (`// swift-tools-version: 6.2`, Sprachmodus v6) — das legt #2 in den
# Package.swift-Dateien fest, nicht dieser Task. Ein zweiter Toolchain über
# mise würde von xcodebuild ohnehin nicht benutzt.
#
# Welches Xcode gilt, entscheidet DEVELOPER_DIR. `xcode-version`, `test` und
# `build` setzen es auf das Standard-Xcode, falls es nicht schon von außen
# kommt — der CI-Runner pinnt Xcode selbst und gewinnt dann. Bewusst als eine
# Zeile pro Task und nicht als [env]-Block: ein [env]-Block macht die Datei
# trust-pflichtig, und ein frischer Klon soll ohne `mise trust` durchlaufen.

[tasks.setup]
description = "Werkzeuge und Abhängigkeiten installieren"
depends = ["xcode-version"]
run = "mise install"

[tasks.check]
description = "Format, Lint, Tests, Lizenz-Gate — dasselbe wie in CI"
depends = ["xcode-version"]
run = '''
set -euo pipefail

# --lint korrigiert nicht, sondern meldet: unformatierter Code soll den Build
# brechen statt still umgeschrieben zu werden. Zum Korrigieren: mise run format
#
# Die Pfade stehen vor --lint, weil SwiftFormat sonst den ersten Pfad als Wert
# der Option liest und mit „--lint argument does not expect a value" abbricht.
swiftformat apps packages --lint

# --strict, weil SwiftLint sonst nur bei Regeln mit Schweregrad „error" einen
# Exit-Code ungleich null liefert und Warnungen durchrutschen würden.
swiftlint --strict --quiet

mise run test
echo "::notice::Lizenz-Gate läuft noch nicht — das Prüfwerkzeug fehlt, kommt mit #17"
'''

[tasks.format]
description = "Quelltext formatieren und behebbare Lint-Funde korrigieren"
run = '''
set -euo pipefail

# Erst SwiftLint, dann SwiftFormat: über das Layout entscheidet am Ende
# SwiftFormat, damit das Ergebnis dem entspricht, was `mise run check` prüft.
swiftlint --fix --quiet
swiftformat apps packages
'''

[tasks.test]
description = "Nur die Package-Tests"
depends = ["xcode-version"]
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

# `xcrun swift` statt `swift`: nur so kommt die Toolchain aus DEVELOPER_DIR
# zum Zug und nicht irgendein anderes swift aus dem Suchpfad.
for paket in packages/*/; do
  echo "── $(basename "$paket")"
  xcrun swift test --package-path "$paket"
done
'''

[tasks.build]
description = "App bauen"
depends = ["xcode-version"]
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

xcodegen generate --spec apps/ZilpZalp/project.yml --quiet

# generic/platform: baut fürs Simulator-SDK ohne ein bestimmtes Gerät zu
# verlangen — auf dem Runner ist nicht gesetzt, welche Simulatoren da sind.
xcodebuild build \
  -project apps/ZilpZalp/ZilpZalp.xcodeproj \
  -scheme ZilpZalp \
  -destination "generic/platform=iOS Simulator" \
  -derivedDataPath DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  | xcbeautify
'''

[tasks.fetch-media]
description = "Medien kuratieren und nach S3 laden"
run = '''
echo "::notice::Kein Kurationswerkzeug — tools/fetch-media kommt mit #15"
'''

[tasks.xcode-version]
description = "Prüft, ob die gepinnte Xcode-Version aktiv ist"
hide = true
run = '''
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

expected="26.6"
abhilfe="Abhilfe: Xcode $expected installieren und per 'sudo xcode-select -s /Pfad/zu/Xcode.app' oder DEVELOPER_DIR aktivieren."

# Fängt beides ab: xcodebuild fehlt ganz, oder das aktive Developer-Verzeichnis
# sind nur die Command Line Tools — dort gibt es kein xcodebuild.
if ! ausgabe="$(xcodebuild -version 2>&1)"; then
  echo "::error::'xcodebuild -version' schlägt fehl, aktives Developer-Verzeichnis: $(xcode-select -p 2>&1)."
  echo "$ausgabe" | sed 's/^/  /'
  echo "$abhilfe"
  exit 1
fi

found="$(printf '%s\n' "$ausgabe" | head -1 | cut -d' ' -f2)"
build="$(printf '%s\n' "$ausgabe" | tail -1 | cut -d' ' -f3)"

if [ "$found" != "$expected" ]; then
  echo "::error::Xcode $expected erwartet, aktiv ist $found (aus $(xcode-select -p))."
  echo "$abhilfe"
  exit 1
fi

echo "Xcode $found (Build $build) — passt"
echo "  swiftc laut Xcode:     $(xcrun swift --version 2>&1 | head -1)"
echo "  swift im Suchpfad:     $(command -v swift) — $(swift --version 2>&1 | head -1)"
'''
