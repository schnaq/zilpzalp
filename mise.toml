# ZilpZalp — the single entry point for every tool.
#
# Everything runs through `mise run …`. Do not call xcodebuild, swift or brew
# directly, or the development machine drifts away from the CI runner.

[tools]
# Pinned exactly: the development machine and the self-hosted runner should use
# the same binaries. No Homebrew — versions would drift apart.
bun         = "1.4.2"   # package manager and runtime for the website in apps/web
python      = "3.13.14" # for the tools in tools/
uv          = "0.12.10" # resolves tools/pyproject.toml for tools/fetch_media
swiftformat = "0.62.1"
swiftlint   = "0.65.0"
xcbeautify  = "3.2.1"
xcodegen    = "2.46.0" # generates apps/ZilpZalp/ZilpZalp.xcodeproj from project.yml

# Xcode cannot be installed through mise and at the same time provides the
# Swift compiler that xcodebuild builds with. So Xcode is not installed but
# verified — see the `xcode-version` task.
#
# On the language version: the spec says "Swift 6.2". Xcode 26.6 ships swiftc
# 6.3.3. "Swift 6.2" therefore reads as the language and tools version
# (`// swift-tools-version: 6.2`, language mode v6), which the Package.swift
# files pin. A second toolchain through mise would not be used by xcodebuild
# anyway.
#
# DEVELOPER_DIR decides which Xcode applies. `xcode-version`, `test` and
# `build` point it at the default Xcode unless it already comes from the
# outside — the CI runner pins Xcode itself and then wins. Deliberately one
# line per task rather than an [env] block: an [env] block makes mise demand
# `mise trust`, and a fresh clone should run without that step.

[tasks.setup]
description = "Install tools and dependencies"
depends = ["xcode-version"]
run = "mise install"

[tasks.check]
description = "Format, lint, tests, licence gate — the same as CI"
depends = ["xcode-version"]
run = '''
set -euo pipefail

# The cheapest and most deterministic checks run first: a licensing mistake
# or a stale bundled pack then fails in milliseconds instead of after a cold
# Swift build. The gate reads data/packs and never sees the bundled copy, so
# without this step drift would only surface minutes later, as a failing
# PackCatalogTests.
mise run sync-packs
# Between the two on purpose: the credits are derived from the manifests, so
# they are regenerated while the derived files are being made current, and the
# gate then judges the manifests themselves.
mise run generate-credits
mise run license-gate

# --lint does not correct, it reports: unformatted code should break the build
# rather than be rewritten silently. To correct it, run mise run format.
#
# The paths come before --lint because SwiftFormat otherwise reads the first
# path as the option's value and aborts with "--lint argument does not expect
# a value".
swiftformat apps packages --lint

# --strict, because SwiftLint otherwise only returns a non-zero exit code for
# rules with severity "error" and warnings would slip through.
swiftlint --strict --quiet

mise run test
'''

[tasks.format]
description = "Format the sources and fix correctable lint findings"
run = '''
set -euo pipefail

# SwiftLint first, then SwiftFormat: SwiftFormat has the last word on layout so
# that the result matches what `mise run check` verifies.
swiftlint --fix --quiet
swiftformat apps packages
'''

[tasks.test]
description = "Package tests only"
depends = ["xcode-version"]
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

# The Python tools first: seconds rather than minutes, so a broken helper
# reports before the Swift packages are built. `-t tools` makes tools/ the
# top-level directory, which is how the tests import license_gate — and
# fetch_media, which is a package below it.
#
# Through uv, because the fetch_media tests need httpx, Pillow and boto3.
# `--locked` refuses to re-resolve, so the versions here are the ones in
# tools/uv.lock; `python-preference = "only-system"` in tools/pyproject.toml
# keeps uv on the interpreter mise pinned instead of downloading its own.
uv run --locked --project tools python -m unittest discover -s tools/tests -t tools

# `xcrun swift` rather than `swift`: only that way does the toolchain from
# DEVELOPER_DIR get used instead of some other swift on the search path.
for package in packages/*/; do
  echo "── $(basename "$package")"
  xcrun swift test --package-path "$package"
done
'''

[tasks.generate]
description = "Generate apps/ZilpZalp/ZilpZalp.xcodeproj from project.yml"
# Run this before opening the project in Xcode. The .xcodeproj is not tracked;
# a project Xcode created by hand compiles two files and fails on the rest.
run = "xcodegen generate --spec apps/ZilpZalp/project.yml --quiet"

[tasks.build]
description = "Build the app"
depends = ["xcode-version", "generate"]
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

# generic/platform: builds against the simulator SDK without demanding a
# specific device — which simulators exist on the runner is not fixed.
xcodebuild build \
  -project apps/ZilpZalp/ZilpZalp.xcodeproj \
  -scheme ZilpZalp \
  -destination "generic/platform=iOS Simulator" \
  -derivedDataPath DerivedData \
  CODE_SIGNING_ALLOWED=NO \
  | xcbeautify
'''

[tasks.archive]
description = "Archive the app for the App Store, unsigned"
depends = ["xcode-version", "generate"]
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

# One place decides where a release build's working files live: $RUNNER_TEMP on
# the runner, a git-ignored directory on a development machine. The archive, the
# signing material and the App Store Connect key all land there, and
# .github/scripts/ios-signing-teardown.sh removes exactly that set again.
out="${RUNNER_TEMP:-$PWD/DerivedData/release}"
mkdir -p "$out"

# The build number is the workflow run number: it never repeats and always
# grows, and App Store Connect refuses a build number it has already seen.
# Outside CI there is no run number, and the 1 below overrides whatever
# project.yml says — a local archive is for inspecting the build, not for a
# second upload.
build_number="${GITHUB_RUN_NUMBER:-1}"

# Archived WITHOUT code signing on purpose. Signing happens at export, so no
# provisioning profile is ever forced onto the three local SwiftPM packages —
# those targets "do not support provisioning profiles" and would fail the
# archive. generic/platform=iOS builds against the device SDK without naming a
# device.
rm -rf "$out/ZilpZalp.xcarchive"
xcodebuild archive \
  -project apps/ZilpZalp/ZilpZalp.xcodeproj \
  -scheme ZilpZalp \
  -configuration Release \
  -destination "generic/platform=iOS" \
  -archivePath "$out/ZilpZalp.xcarchive" \
  -derivedDataPath DerivedData \
  CURRENT_PROJECT_VERSION="$build_number" \
  CODE_SIGNING_ALLOWED=NO \
  CODE_SIGNING_REQUIRED=NO \
  | xcbeautify
'''

[tasks.upload]
description = "Sign the archive from 'mise run archive' and send it to TestFlight"
depends = ["xcode-version"]
# Needs the signing material and the App Store Connect key from Infisical:
#   infisical run --env=prod --path=/ios -- mise run upload
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

# The same rule as in `archive` — see the comment there.
export RUNNER_TEMP="${RUNNER_TEMP:-$PWD/DerivedData/release}"

: "${ASC_KEY_ID:?missing (Infisical prod /ios)}"
: "${ASC_ISSUER_ID:?missing (Infisical prod /ios)}"
: "${ASC_KEY_P8_BASE64:?missing (Infisical prod /ios)}"

# Signing material must not outlive the run — the runner is persistent. The
# workflow repeats this with `if: always()`, for the cancelled or timed-out job
# in which this trap never fires.
trap 'bash .github/scripts/ios-signing-teardown.sh' EXIT

bash .github/scripts/ios-signing-setup.sh

# The App Store Connect key authenticates the *upload*, not the signing — the
# certificate imported above does that. Written readable to its owner only and
# removed again by the teardown.
key="$RUNNER_TEMP/asc-key.p8"
(umask 077 && printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode >"$key")

# A single call signs the archive and hands it to App Store Connect: the
# ExportOptions.plist the setup script wrote asks for `destination: upload`.
# That is why this pipeline needs neither fastlane nor Ruby. -exportPath still
# receives the export log and the distribution summary.
xcodebuild -exportArchive \
  -archivePath "$RUNNER_TEMP/ZilpZalp.xcarchive" \
  -exportPath "$RUNNER_TEMP/export" \
  -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
  -authenticationKeyPath "$key" \
  -authenticationKeyID "$ASC_KEY_ID" \
  -authenticationKeyIssuerID "$ASC_ISSUER_ID"
'''

[tasks.screenshots]
description = "Take the App Store screenshots on the two store simulators"
depends = ["xcode-version", "generate"]
# Deliberately not part of `mise run check`, `mise run build` or CI: it drives
# the app on a booted simulator and takes minutes, and a screenshot is not a
# gate. The UI test target it builds hangs off its own scheme for the same
# reason — see apps/ZilpZalp/project.yml.
run = '''
set -euo pipefail
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

out="$PWD/DerivedData/screenshots"
rm -rf "$out"

# Built once against the simulator SDK and then run per device: the same
# bundle drives both, and building it twice would cost minutes for nothing.
xcodebuild build-for-testing \
  -project apps/ZilpZalp/ZilpZalp.xcodeproj \
  -scheme ZilpZalpScreenshots \
  -destination "generic/platform=iOS Simulator" \
  -derivedDataPath DerivedData \
  | xcbeautify

# The status bar is a setting of the simulator and outlives the run, so it is
# put back whatever happens — a cancelled run must not leave 9:41 baked into
# somebody's simulator.
device=""
trap 'if [ -n "$device" ]; then xcrun simctl status_bar "$device" clear || true; fi' EXIT

# The two sizes App Store Connect asks for before the first review: the 6.9"
# iPhone at 1320x2868 and the 13" iPad at 2064x2752, both portrait. By name
# rather than by udid — a udid belongs to one machine, and simctl takes a
# device name wherever it takes a device. Read on fd 3 so that xcodebuild,
# which reads standard input, cannot swallow the list it is looping over. A
# shell array would sidestep that without a second descriptor and is what this
# would be in bash; mise runs a task through `sh -c`, where there are none.
while IFS="|" read -r slug device width height <&3; do
  echo "── $device"

  # Boots it if it is not up: the status bar can only be set on a booted
  # device, and the test needs one anyway.
  xcrun simctl bootstatus "$device" -b

  # 9:41 with everything full, the way Apple's own screenshots read, so that
  # the pictures do not date themselves by the clock they were taken at.
  xcrun simctl status_bar "$device" override \
    --time 9:41 \
    --batteryState charged \
    --batteryLevel 100 \
    --wifiBars 3 \
    --cellularBars 4

  # xcodebuild hands every TEST_RUNNER_-prefixed variable to the test runner
  # with the prefix taken off, and that is how the output directory reaches
  # the test — which is why nothing has to be dug out of an .xcresult after.
  TEST_RUNNER_SCREENSHOT_DIR="$out/$slug" \
  xcodebuild test-without-building \
    -project apps/ZilpZalp/ZilpZalp.xcodeproj \
    -scheme ZilpZalpScreenshots \
    -destination "platform=iOS Simulator,name=$device" \
    -derivedDataPath DerivedData \
    | xcbeautify

  xcrun simctl status_bar "$device" clear

  # Through uv, because this one needs Pillow. It is what makes the promise
  # the store cares about: the exact size, and no alpha channel.
  uv run --locked --project tools python tools/finish_screenshots.py \
    "$out/$slug" "$width" "$height"
done 3<<"DEVICES"
iphone-17-pro-max|iPhone 17 Pro Max|1320|2868
ipad-pro-13|iPad Pro 13-inch (M5)|2064|2752
DEVICES

echo "Screenshots in $out"
'''

[tasks.license-gate]
description = "Check the pack manifests against the licence rules"
run = '''
set -euo pipefail

# `python` is the interpreter pinned above, not whatever python3 the machine
# happens to carry. The gate uses the standard library only, so there is
# nothing else to install. Its tests run in `mise run test`.
python tools/license_gate.py
'''

[tasks.sync-packs]
description = "Copy the bundled packs into ZilpZalpData and fail if they had drifted"
run = '''
set -euo pipefail

# Locally this heals the copy under packages/ZilpZalpData/…/Resources/Packs.
# In CI it is the drift check: it exits non-zero whenever it had to change
# anything, because then the commit ships a pack that differs from data/packs.
python tools/sync_bundled_packs.py
'''

[tasks.generate-credits]
description = "Write CREDITS.md and credits.json from the manifests and fail if they had drifted"
run = '''
set -euo pipefail

# Locally this heals both files. In CI it is the drift check: it exits non-zero
# whenever it had to change anything, because then the committed credits did
# not match the assets they name. Attribution is never written by hand.
python tools/generate_credits.py
'''

[tasks.fetch-media]
description = "Curate media: 'photos …', 'calls …', 'speech …', 'upload' — add --help for any"
# One line on purpose: mise appends the arguments of `mise run fetch-media …`
# to the end of the command, so the subcommands reach the tool unchanged.
#
#   mise run fetch-media photos candidates --pack deutschland --limit 5
#   mise run fetch-media photos pick --pack deutschland --species amsel \
#       --observation 20490738 --photo 31623386
#   mise run fetch-media photos frame --pack deutschland --species amsel \
#       --observation 20490738 --photo 31623386 [--dry-run]
#   mise run fetch-media photos audit --pack deutschland [--add-verdicts -]
#   mise run fetch-media speech import --pack deutschland --species amsel \
#       --sentence quiz.prompt.whereIs --file take3.wav --attribution "Stimme: …"
#
# `photos frame` is `photos pick` with the square computed around the bird
# instead of around the middle of the photo: Apple Vision finds the bird, and
# `--box x0,y0,x1,y1` overrides it with normalised coordinates when saliency
# picks the wrong thing. `photos audit` exports every tile of a pack to
# DerivedData/audit/<pack>/ and merges the verdicts back — the judging itself
# is a vision model outside the tool, which is why neither step needs a
# credential. docs/medien-und-lizenzen.md describes the whole round.
#
# Finding and picking a photo needs no credential at all, and neither does
# importing a recording somebody made. The calls, the upload and a speech
# provider that speaks over the network do, and the caller wraps them, exactly
# as issue #14 describes:
#
#   infisical run --env=dev --path=/ -- mise run fetch-media calls candidates --pack deutschland
#   infisical run --env=dev --path=/ -- mise run fetch-media calls pick --pack deutschland \
#       --species amsel --recording XC965144 --start 12.5
#   infisical run --env=dev --path=/ -- mise run fetch-media upload --pack deutschland
#   infisical run --env=dev --path=/ -- mise run fetch-media speech render \
#       --pack deutschland --species amsel --provider …
#
# The xeno-canto API v3 refuses every request without `XENO_CANTO_API_KEY`, and
# the upload needs the bucket keys; both read them from the environment. A
# speech provider will read `SPEECH_API_KEY` the same way — `--provider fake`
# reaches nobody and needs nothing.
#
# Deliberately not the other way round. Wrapping the task itself would make
# every subcommand demand an Infisical login, and the two that need nothing
# would stop working on a machine without one. Without the prefix each command
# names the variables it is missing and the command that provides them.
# Curation runs against `dev`; `prod` holds only the signing values.
run = "uv run --locked --project tools python -m fetch_media"

[tasks."web:install"]
description = "Install the dependencies of the website in apps/web"
dir = "apps/web"
# --frozen-lockfile on purpose, exactly as in CI: bun.lock is committed, and an
# install that quietly rewrites it would let a machine build against versions
# nobody reviewed. Adding a dependency is `bun add …` in apps/web, which updates
# the lockfile as its own visible change.
run = "bun install --frozen-lockfile"

[tasks."web:dev"]
description = "Serve the website on localhost with hot reload"
dir = "apps/web"
# NEXT_TELEMETRY_DISABLED, here and in `web:build`: Next.js otherwise reports
# anonymous usage data home. Nothing in this repository talks to a third party
# unasked — least of all the site that promises exactly that to parents.
run = "NEXT_TELEMETRY_DISABLED=1 bun run dev"

[tasks."web:lint"]
description = "Lint the website"
dir = "apps/web"
# Next.js 16 removed `next lint`; this is the ESLint CLI against the flat
# config in apps/web/eslint.config.mjs. Deliberately not part of
# `mise run check`, which is the Swift gate and must not need node_modules.
run = "bun run lint"

[tasks."web:build"]
description = "Build the website — the same build CI and Vercel run"
dir = "apps/web"
run = "NEXT_TELEMETRY_DISABLED=1 bun run build"

[tasks.xcode-version]
description = "Checks that the pinned Xcode version is active"
hide = true
run = '''
export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"

expected="26.6"
remedy="Remedy: install Xcode $expected and activate it with 'sudo xcode-select -s /path/to/Xcode.app' or DEVELOPER_DIR."

# Catches both cases: xcodebuild missing entirely, or the active developer
# directory being the command line tools only — there is no xcodebuild there.
if ! output="$(xcodebuild -version 2>&1)"; then
  echo "::error::'xcodebuild -version' fails, active developer directory: $(xcode-select -p 2>&1)."
  echo "$output" | sed 's/^/  /'
  echo "$remedy"
  exit 1
fi

found="$(printf '%s\n' "$output" | head -1 | cut -d' ' -f2)"
build="$(printf '%s\n' "$output" | tail -1 | cut -d' ' -f3)"

if [ "$found" != "$expected" ]; then
  echo "::error::Xcode $expected expected, active is $found (from $(xcode-select -p))."
  echo "$remedy"
  exit 1
fi

echo "Xcode $found (build $build) — matches"
echo "  swiftc per Xcode:      $(xcrun swift --version 2>&1 | head -1)"
echo "  swift on the path:     $(command -v swift) — $(swift --version 2>&1 | head -1)"
'''
