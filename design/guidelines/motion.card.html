<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/motion.css"><style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.c{border-radius:var(--radius-sm);border:2px solid rgba(34,48,31,.08);width:96px;overflow:hidden;background:var(--white)}
.c i{display:block;height:56px}.c b{display:block;font:var(--weight-bold) 13px/1.2 var(--font-body);padding:6px 8px 2px;color:var(--text-strong)}
.c s{display:block;text-decoration:none;font:var(--weight-regular) 11px/1.2 var(--font-body);padding:0 8px 7px;color:var(--text-muted)}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;font:15px/1.4 var(--font-body)}
.k{font:var(--weight-bold) 15px/1.4 var(--font-body);color:var(--text-strong)}
.dot{width:30px;height:30px;border-radius:var(--radius-pill);background:var(--color-accent);animation:zz-bob 1.6s var(--ease-in-out) infinite}
.row{display:flex;align-items:center;gap:14px}</style></head><body><div class="g">
<div><span class="k">--ease-bounce</span> · Auftritte, Sticker, Feedback</div><div><span class="k">260ms</span> normal</div>
<div><span class="k">--ease-out</span> · Übergänge, Bewegung</div><div><span class="k">160ms</span> fast</div>
<div><span class="k">--dur-instant 90ms</span> · Press-Feedback</div><div><span class="k">420ms</span> slow · Screenwechsel</div>
<div class="row"><span class="dot"></span><span>Ruhende Vögel „boben“ 8px, 1.6s, endlos</span></div><div><span class="k">900ms</span> celebrate · Konfetti, Sterne</div></div></body></html>
