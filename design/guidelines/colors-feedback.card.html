<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/motion.css"><style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.c{border-radius:var(--radius-sm);border:2px solid rgba(34,48,31,.08);width:96px;overflow:hidden;background:var(--white)}
.c i{display:block;height:56px}.c b{display:block;font:var(--weight-bold) 13px/1.2 var(--font-body);padding:6px 8px 2px;color:var(--text-strong)}
.c s{display:block;text-decoration:none;font:var(--weight-regular) 11px/1.2 var(--font-body);padding:0 8px 7px;color:var(--text-muted)}.p{display:flex;gap:14px;flex-wrap:wrap}.pill{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:var(--radius-pill);border:3px solid;font:var(--weight-bold) 22px/1 var(--font-display)}
.no{padding:14px 22px;border-radius:var(--radius-pill);border:3px dashed #D14343;color:#D14343;background:#FDECEC;font:var(--weight-bold) 20px/1 var(--font-display);opacity:.85}</style></head><body><div class="p">
<div class="pill" style="background:var(--color-correct-soft);border-color:var(--color-correct);color:var(--olive-800)">Genau!</div>
<div class="pill" style="background:var(--color-retry-soft);border-color:var(--color-retry);color:var(--bark-700)">Fast!</div>
<div class="pill" style="background:var(--sky-50);border-color:var(--sky-300);color:var(--sky-600)">Hör nochmal hin</div>
<div class="no">✗ kein Rot, kein „Falsch“</div></div></body></html>
