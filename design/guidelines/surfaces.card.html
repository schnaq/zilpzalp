<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/motion.css"><style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.c{border-radius:var(--radius-sm);border:2px solid rgba(42,34,19,.10);width:96px;overflow:hidden;background:var(--cream-50)}
.c i{display:block;height:56px}.c b{display:block;font:var(--weight-bold) 13px/1.2 var(--font-body);padding:6px 8px 2px;color:var(--text-strong)}
.c s{display:block;text-decoration:none;font:var(--weight-regular) 11px/1.2 var(--font-body);padding:0 8px 7px;color:var(--text-muted)}.r{display:flex;gap:18px}
.pg{flex:1;background:var(--surface-page);border-radius:var(--radius-md);padding:16px;border:2px dashed var(--sand-400)}
.cd{background:var(--surface-card);border:3px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-md);padding:16px;font:var(--weight-bold) 16px/1.3 var(--font-display);color:var(--text-strong)}
.fo{flex:1;background:var(--surface-forest);border-radius:var(--radius-md);padding:16px;color:var(--cream-50);font:var(--weight-bold) 16px/1.4 var(--font-display)}
.sk{flex:1;background:var(--surface-warm);border-radius:var(--radius-md);padding:16px;color:var(--orange-700);font:var(--weight-bold) 16px/1.4 var(--font-display)}
.m{font:12px/1.4 var(--font-body);color:var(--text-muted);margin-top:10px}</style></head><body><div class="r"><div class="pg"><div class="cd">Karte auf Hafer</div><p class="m">--surface-page + --surface-card</p></div>
<div class="fo">Vollbild-Wiese<br><span style="font:400 12px/1.4 var(--font-body);opacity:.85">Belohnung, Kapitelstart</span></div>
<div class="sk">Warm<br><span style="font:400 12px/1.4 var(--font-body);opacity:.85">Ruf- & Hörthemen</span></div></div></body></html>
