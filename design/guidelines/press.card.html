<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/motion.css"><style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.c{border-radius:var(--radius-sm);border:2px solid rgba(34,48,31,.08);width:96px;overflow:hidden;background:var(--white)}
.c i{display:block;height:56px}.c b{display:block;font:var(--weight-bold) 13px/1.2 var(--font-body);padding:6px 8px 2px;color:var(--text-strong)}
.c s{display:block;text-decoration:none;font:var(--weight-regular) 11px/1.2 var(--font-body);padding:0 8px 7px;color:var(--text-muted)}.r{display:flex;gap:26px;align-items:center}
.b{font:var(--weight-bold) 24px/1 var(--font-display);color:var(--white);background:var(--color-primary);border-radius:var(--radius-pill);padding:22px 34px}
.up{box-shadow:0 8px 0 var(--olive-700)}.dn{box-shadow:0 2px 0 var(--olive-700);transform:translateY(6px)}
.m{font:13px/1.5 var(--font-body);color:var(--text-muted);max-width:230px}
.lbl{font:var(--weight-bold) 12px/1 var(--font-body);color:var(--text-muted);display:block;margin-top:14px;text-align:center}</style></head><body><div class="r"><div><div class="b up">Weiter</div><span class="lbl">ruhend</span></div>
<div><div class="b dn">Weiter</div><span class="lbl">gedrückt</span></div>
<p class="m">Ledge = 6–10px solid, immer die 700er-Variante der Flächenfarbe. Press: <code>translateY</code> auf 2px Ledge, 90ms. Hover (nur iPad-Trackpad) hellt die Fläche um 12% auf. Kein Schwarz, keine harten Versatzschatten.</p></div></body></html>
