<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('home');
  const [stars, setStars] = React.useState(11);
  const go = (s) => setScreen(s);
  const props = { go, stars, onScore: () => setStars(s => s + 1) };
  const S = { home: HomeScreen, quiz: QuizScreen, reward: RewardScreen, collection: CollectionScreen, grownups: GrownupsScreen }[screen];
  return <S {...props} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
