# Secrets smoke test.
#
# Purpose: proves that the Infisical machine identity configured for CI (see
# docs/secrets.md) can actually authenticate and read from the ZilpZalp
# project. This closes the last open item of #6 (the M0 Infisical setup) -
# the three INFISICAL_* repository secrets exist, but until this workflow
# runs green once, nobody has confirmed CI can use them.
#
# How to run: Actions -> "Secrets smoke" -> "Run workflow".
#
# On purpose, this reads exactly one non-sensitive value (S3_BUCKET, the
# Scaleway bucket name - see docs/secrets.md) instead of anything actually
# secret. That value is still masked before use, and only its length is
# printed, so nothing from Infisical ever reaches the log.

name: Secrets smoke

on:
  workflow_dispatch:

concurrency:
  group: secrets-smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Infisical GitHub Action addresses projects by slug, not by the
  # workspace ID in .infisical.json (9820fa11-518f-4760-a64f-7f832e6c2e8a) -
  # CLI and Action disagree here the same way they disagree about the
  # `domain` format (see docs/secrets.md). The slug is not sensitive (the
  # unlock repo commits its own, `unlock-ums9`, in mobile-cd.yml), but it is
  # not in this repo, and no GitHub secret or variable holds it yet (checked
  # with `gh secret list` / `gh variable list` before opening this PR).
  #
  # Christian: please set the repository variable INFISICAL_PROJECT_SLUG
  # (Settings -> Secrets and variables -> Actions -> Variables) to the
  # ZilpZalp project's slug from Infisical -> Project Settings. Until that
  # variable exists, this workflow fails at the "Load one secret from
  # Infisical" step with an empty project-slug.
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}

jobs:
  smoke:
    name: Read one value from Infisical
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Universal Auth, scoped to exactly one secret via `secret-name` so
      # nothing else in `/` is ever exported into the job environment.
      - name: Load one secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_API_URL }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /
          secret-name: S3_BUCKET
          export-type: env

      # GitHub does not mask values exported by this action automatically
      # (see docs/secrets.md), so mask first, before any other command runs -
      # never `env | ...` or similar, which would print the value before the
      # mask takes effect.
      - name: Mask and verify S3_BUCKET
        run: |
          echo "::add-mask::$S3_BUCKET"
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::S3_BUCKET is empty or was not exported by the Infisical action"
            exit 1
          fi
          echo "S3_BUCKET has ${#S3_BUCKET} characters"
