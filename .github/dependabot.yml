version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - "type:chore"

  # tools/pyproject.toml and tools/uv.lock, the environment tools/fetch_media
  # runs in. The `uv` ecosystem rather than `pip`, because only it updates the
  # manifest and the lock file together — with `pip` the lock would stay behind
  # and `uv run --locked` in `mise run test` would fail on every Dependabot
  # pull request. render_app_icon.py keeps its dependencies as inline PEP 723
  # script metadata, which Dependabot does not read; it is a one-off renderer
  # that no build depends on.
  - package-ecosystem: uv
    directory: "/tools"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - "type:chore"
