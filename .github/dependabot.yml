version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - "type:chore"

  - package-ecosystem: pip
    directories:
      - "/tools"
      - "/tools/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - "type:chore"
