# Source of truth for the Xcode project.
#
# `ZilpZalp.xcodeproj` is generated from this file (`mise run build` invokes
# XcodeGen) and is git-ignored: no binary blobs in the repo, no merge conflicts
# in a generated project file.

name: ZilpZalp

options:
  # The app ships in German only; it is built to be localisable.
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  ZilpZalpCore:
    path: ../../packages/ZilpZalpCore
  ZilpZalpData:
    path: ../../packages/ZilpZalpData
  ZilpZalpUI:
    path: ../../packages/ZilpZalpUI

targets:
  ZilpZalp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        # OFL.txt/NOTICE.md travel with the fonts in the source tree (font
        # licensing requirement + provenance for the future Credits screen,
        # #18) but are not app resources, so they stay out of the bundle.
        excludes:
          - "Fonts/**/OFL.txt"
          - "Fonts/**/NOTICE.md"
    # All three packages hang off the app target so they are built and linked
    # for iOS. The placeholder screen does not need them yet.
    dependencies:
      - package: ZilpZalpCore
      - package: ZilpZalpData
      - package: ZilpZalpUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.zilpzalp
        PRODUCT_NAME: ZilpZalp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        # 1 = iPhone, 2 = iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        # Xcode only knows language modes (4, 4.2, 5, 6). "Swift 6.2" from the
        # spec means language mode 6 plus the toolchain of the pinned Xcode.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Info.plist is generated at build time from these keys — nothing
        # generated sits in the source tree.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ZilpZalp
        # Points at Resources/Assets.xcassets/AppIcon.appiconset — single size
        # (1024x1024) with Dark and Tinted variants, see tools/render_app_icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # All orientations for now; what the design actually needs becomes
        # clear with the game screens.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
    # UIAppFonts is an array, and GENERATE_INFOPLIST_FILE only ever merges in
    # the curated set of INFOPLIST_KEY_* keys Xcode knows about — confirmed by
    # building with INFOPLIST_KEY_UIAppFonts set: it is silently dropped from
    # the compiled Info.plist. `info.path` below is the documented XcodeGen
    # escape hatch: it writes a small companion plist on every `generate`,
    # merged with the INFOPLIST_KEY_* values above at build time. Generated
    # like the .xcodeproj itself, so it is git-ignored, not the source of
    # truth. Resource copy flattens Resources/ subfolders, so these are bare
    # filenames, not the Fonts/<Family>/... path they live at in the tree.
    info:
      path: Generated/Info.plist
      properties:
        UIAppFonts:
          - Baloo2-VariableFont_wght.ttf
          - Nunito-VariableFont_wght.ttf

schemes:
  ZilpZalp:
    build:
      targets:
        ZilpZalp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
